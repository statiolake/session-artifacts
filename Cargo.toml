[package]
name = "session-whiteboard"
version = "0.1.0"
edition = "2024"
description = "A daemon and browser viewer for live per-session HTML artifacts"
license = "MIT"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
directories = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"

[profile.release]
lto = true
codegen-units = 1
strip = true
