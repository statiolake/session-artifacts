<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Session Whiteboard</title>
  <style>
    :root {
      color-scheme: light;
      --canvas: #eeece5;
      --panel: #f7f6f1;
      --panel-raised: #e5e2d9;
      --inset: #e8e5dc;
      --ink: #293130;
      --ink-secondary: #59635f;
      --ink-muted: #7d8580;
      --line: rgba(41,49,48,.16);
      --line-soft: rgba(41,49,48,.09);
      --focus: #176a83;
      --positive: #27754f;
      --warning: #a66d24;
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 12px;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body {
      overflow: hidden;
      color: var(--ink);
      background: var(--canvas);
      -webkit-font-smoothing: antialiased;
    }
    button, summary { font: inherit; }
    button:focus-visible, summary:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }
    .shell {
      display: grid;
      grid-template-columns: 272px minmax(0, 1fr);
      width: 100%;
      height: 100%;
      min-height: 0;
    }
    .sidebar {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      background: var(--panel);
      border-right: 1px solid var(--line);
    }
    .section-label, .group-title, .path {
      font: 600 10px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .sessions {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      padding: 8px 6px;
      scrollbar-color: var(--panel-raised) transparent;
    }
    .section-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 8px 5px;
      color: var(--ink-muted);
    }
    .section-count {
      color: var(--ink-secondary);
      font-variant-numeric: tabular-nums;
    }
    .group { margin: 0 0 8px; }
    .group-title {
      display: flex;
      align-items: baseline;
      gap: 8px;
      overflow: hidden;
      padding: 3px 8px 4px;
      color: var(--ink-muted);
      letter-spacing: 0;
      text-transform: none;
    }
    .group-name {
      flex: none;
      overflow: hidden;
      color: var(--ink-secondary);
      font: 650 11px/1.2 ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .group-path {
      min-width: 0;
      overflow: hidden;
      color: var(--ink-muted);
      direction: rtl;
      font: 10px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace;
      text-align: left;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .session {
      display: block;
      width: 100%;
      min-height: 42px;
      padding: 6px 8px;
      border: 1px solid transparent;
      border-radius: 5px;
      color: inherit;
      text-align: left;
      background: transparent;
      cursor: pointer;
      transition: background-color 140ms ease-out, border-color 140ms ease-out;
    }
    .session-row {
      display: flex;
      align-items: stretch;
      gap: 3px;
    }
    .session-row .session { flex: 1 1 auto; min-width: 0; }
    .session-deactivate {
      flex: none;
      width: 28px;
      padding: 0;
      border: 1px solid transparent;
      border-radius: 4px;
      color: var(--ink-muted);
      background: transparent;
      cursor: pointer;
      font-size: 15px;
      line-height: 1;
      opacity: .55;
    }
    .session-row:hover .session-deactivate,
    .session-deactivate:focus-visible { opacity: 1; }
    .session-deactivate:hover {
      border-color: rgba(166,109,36,.35);
      color: var(--warning);
      background: rgba(166,109,36,.06);
    }
    .session:hover { background: rgba(41,49,48,.045); }
    .session.active {
      background: rgba(23,106,131,.08);
      border-color: rgba(23,106,131,.25);
    }
    .session.inactive { color: var(--ink-secondary); }
    .session-title {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      color: var(--ink);
      font-size: 12px;
      font-weight: 600;
    }
    .session-title-text {
      min-width: 0;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .unread-mark {
      order: -1;
      flex: none;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--focus);
      box-shadow: 0 0 0 2px rgba(23,106,131,.13);
    }
    .session.inactive .session-title { color: var(--ink-secondary); }
    .session-meta {
      display: flex;
      gap: 7px;
      margin-top: 3px;
      overflow: hidden;
      color: var(--ink-muted);
      font: 10px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace;
      white-space: nowrap;
    }
    .session-meta span { overflow: hidden; text-overflow: ellipsis; }
    .empty-side {
      padding: 11px 8px 16px;
      color: var(--ink-muted);
      line-height: 1.5;
    }
    .inactive-section {
      margin-top: 10px;
      border-top: 1px solid var(--line-soft);
    }
    .inactive-section summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 8px 5px;
      color: var(--ink-muted);
      cursor: pointer;
      list-style: none;
    }
    .inactive-section summary::-webkit-details-marker { display: none; }
    .inactive-section summary::before {
      margin-right: 6px;
      color: var(--ink-secondary);
      content: "▸";
    }
    .inactive-section[open] summary::before { content: "▾"; }
    .inactive-label {
      display: flex;
      align-items: center;
      flex: 1;
      font: 600 10px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .inactive-count {
      color: var(--ink-muted);
      font: 10px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .content {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      background: var(--canvas);
    }
    .content-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 52px;
      padding: 0 16px;
      border-bottom: 1px solid var(--line);
    }
    .path {
      overflow: hidden;
      color: var(--ink-muted);
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .path strong { color: var(--ink-secondary); font-weight: 600; }
    .live {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex: none;
      color: var(--ink-muted);
      font: 10px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace;
      text-transform: uppercase;
    }
    .live::before {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--focus);
      content: "";
    }
    .frame-wrap { position: relative; flex: 1; min-height: 0; }
    #artifact {
      display: none;
      width: 100%;
      height: 100%;
      border: 0;
      background: var(--canvas);
    }
    .welcome {
      display: grid;
      align-content: center;
      width: min(540px, 100%);
      height: 100%;
      margin: 0 auto;
      padding: 24px;
    }
    .welcome-kicker {
      margin-bottom: 9px;
      color: var(--focus);
      font: 600 10px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: .10em;
      text-transform: uppercase;
    }
    .welcome h2 {
      margin: 0 0 8px;
      color: var(--ink);
      font-size: 25px;
      font-weight: 650;
      letter-spacing: -.045em;
      line-height: 1;
      text-wrap: balance;
    }
    .welcome p {
      max-width: 430px;
      margin: 0;
      color: var(--ink-secondary);
      font-size: 13px;
      line-height: 1.5;
      text-wrap: pretty;
    }
    @media (max-width: 700px) {
      .shell { grid-template-columns: 1fr; grid-template-rows: minmax(158px, 34vh) minmax(0, 1fr); }
      .sidebar { min-height: 0; border-right: 0; border-bottom: 1px solid var(--line); }
      .sessions { padding: 6px; }
      .group { margin-bottom: 5px; }
      .session { min-height: 40px; padding-top: 5px; padding-bottom: 5px; }
      .content-head { padding: 0 12px; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <nav id="sessions" class="sessions" aria-label="Session whiteboards"></nav>
    </aside>
    <main class="content">
      <header class="content-head">
        <div id="current-path" class="path"><strong>WHITEBOARD</strong> / SELECT A SESSION</div>
        <div id="live-indicator" class="live">waiting</div>
      </header>
      <div class="frame-wrap">
        <section id="welcome" class="welcome">
          <div>
            <div class="welcome-kicker">Current context</div>
            <h2>Nothing is active yet</h2>
            <p>When an agent opens a session whiteboard, it will appear in the navigation rail. Select it to follow the live view.</p>
          </div>
        </section>
        <iframe id="artifact" title="Session whiteboard"></iframe>
      </div>
    </main>
  </div>
  <script>
    const sessionList = document.querySelector('#sessions');
    const frame = document.querySelector('#artifact');
    const welcome = document.querySelector('#welcome');
    const currentPath = document.querySelector('#current-path');
    const liveIndicator = document.querySelector('#live-indicator');
    let sessions = [];
    let selected = null;
    let selectedVersion = null;
    let requestedSession = new URLSearchParams(window.location.search).get('session');
    let eventsConnected = false;
    let inactiveOpen = false;
    const unread = new Set();
    const readVersions = new Map();

    try {
      const saved = JSON.parse(localStorage.getItem('session-whiteboard-read-versions') || '{}');
      Object.keys(saved).forEach(function(key) { readVersions.set(key, saved[key]); });
    } catch (_) {}

    function esc(value) {
      return String(value).replace(/[&<>'"]/g, function(c) {
        return {'&':'&amp;', '<':'&lt;', '>':'&gt;', "'":'&#39;', '"':'&quot;'}[c];
      });
    }

    function versionTime(session) {
      const value = String(session.version || '').split('-', 1)[0];
      const parsed = Number(value);
      return Number.isFinite(parsed) ? parsed : 0;
    }

    function groupKey(path) { return path || '(unknown cwd)'; }

    function renderGroups(items) {
      const groups = new Map();
      for (const session of items) {
        const key = groupKey(session.cwd);
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push(session);
      }
      return Array.from(groups.entries()).map(function(entry) {
        const cwd = entry[0];
        const buttons = entry[1].map(function(s) {
          const isUnread = unread.has(s.key);
          const selectButton = '<button class="session ' + (s.key === selected ? 'active ' : '') + (s.active ? '' : 'inactive') +
            '" data-key="' + esc(s.key) + '" aria-pressed="' + (s.key === selected ? 'true' : 'false') + '">' +
            '<div class="session-title"><span class="session-title-text">' + esc(s.title || 'Untitled session') + '</span>' +
            (isUnread ? '<span class="unread-mark" title="Updated since last open" aria-label="Updated since last open"></span>' : '') + '</div>' +
            '<div class="session-meta"><span>' + esc(s.provider) + '</span><span>' +
            esc(String(s.session_id || '').slice(0, 8)) + '</span></div>' +
            '</button>';
          const deactivateButton = s.active
            ? '<button class="session-deactivate" type="button" data-deactivate="' + esc(s.key) + '" title="Mark inactive" aria-label="Mark ' + esc(s.title || 'session') + ' inactive">×</button>'
            : '';
          return '<div class="session-row">' + selectButton + deactivateButton + '</div>';
        }).join('');
        const normalized = String(cwd || '').replace(/[\\/]+$/, '');
        const projectName = normalized.split(/[\\/]/).pop() || normalized || '(unknown)';
        return '<section class="group"><div class="group-title" title="' + esc(cwd) + '">' +
          '<span class="group-name">' + esc(projectName) + '</span><span class="group-path">' + esc(cwd) + '</span>' +
          '</div>' + buttons + '</section>';
      }).join('');
    }

    function bindSessionButtons() {
      sessionList.querySelectorAll('.session').forEach(function(button) {
        button.addEventListener('click', function() { select(button.dataset.key); });
      });
      sessionList.querySelectorAll('.session-deactivate').forEach(function(button) {
        button.addEventListener('click', function(event) {
          event.stopPropagation();
          deactivate(button.dataset.deactivate);
        });
      });
    }

    function renderSessions() {
      const active = sessions.filter(function(s) { return s.active; });
      const inactive = sessions.filter(function(s) { return !s.active; });
      if (!sessions.length) {
        sessionList.innerHTML = '<div class="section-label"><span>Sessions</span><span class="section-count">0</span></div>' +
          '<div class="empty-side">No session whiteboards yet.</div>';
        return;
      }
      const activeMarkup = active.length
        ? renderGroups(active)
        : '<div class="empty-side">No active sessions.</div>';
      const inactiveMarkup = inactive.length
        ? '<details class="inactive-section"' + (inactiveOpen ? ' open' : '') +
          '><summary><span class="inactive-label">Inactive</span><span class="inactive-count">' +
          inactive.length + '</span></summary><div>' + renderGroups(inactive) + '</div></details>'
        : '';
      sessionList.innerHTML =
        '<div class="section-label"><span>Active</span><span class="section-count">' + active.length + '</span></div>' +
        activeMarkup + inactiveMarkup;
      bindSessionButtons();
      const inactiveSection = sessionList.querySelector('.inactive-section');
      if (inactiveSection) {
        inactiveSection.addEventListener('toggle', function() {
          inactiveOpen = inactiveSection.open;
        });
      }
    }

    function updateSelectionChrome() {
      const session = sessions.find(function(s) { return s.key === selected; });
      if (!session) {
        currentPath.innerHTML = '<strong>WHITEBOARD</strong> / SELECT A SESSION';
        liveIndicator.textContent = 'waiting';
        return;
      }
      currentPath.innerHTML = '<strong>' + esc(session.title || 'UNTITLED') + '</strong> / ' + esc(session.cwd || '');
      liveIndicator.textContent = session.active ? 'live' : 'inactive';
    }

    function persistReadVersions() {
      try {
        const values = {};
        readVersions.forEach(function(version, key) { values[key] = version; });
        localStorage.setItem('session-whiteboard-read-versions', JSON.stringify(values));
      } catch (_) {}
    }

    function markRead(key, version) {
      if (!key || !version) return;
      unread.delete(key);
      readVersions.set(key, version);
      persistReadVersions();
    }

    function reconcileUnread() {
      sessions.forEach(function(session) {
        const seen = readVersions.get(session.key);
        if (seen && seen !== session.version && session.key !== selected) unread.add(session.key);
        if (session.key === selected) markRead(session.key, session.version);
      });
    }

    async function loadSessions() {
      try {
        const currentInactiveSection = sessionList.querySelector('.inactive-section');
        if (currentInactiveSection) inactiveOpen = currentInactiveSection.open;
        const response = await fetch('/api/sessions', { cache: 'no-store' });
        if (!response.ok) throw new Error('HTTP ' + response.status);
        sessions = await response.json();
        sessions.sort(function(a, b) { return versionTime(b) - versionTime(a); });
        reconcileUnread();
        renderSessions();
        updateSelectionChrome();
        if (requestedSession && sessions.some(function(s) { return s.key === requestedSession; })) {
          const key = requestedSession;
          requestedSession = null;
          await select(key);
        }
        if (selected && !sessions.some(function(s) { return s.key === selected; })) {
          selected = null;
          selectedVersion = null;
          frame.style.display = 'none';
          welcome.style.display = 'grid';
          updateSelectionChrome();
        }
      } catch (error) {
        liveIndicator.textContent = 'offline';
      }
    }

    async function select(key) {
      selected = key;
      const session = sessions.find(function(s) { return s.key === key; });
      if (session && !session.active) inactiveOpen = true;
      if (session) markRead(session.key, session.version);
      selectedVersion = null;
      history.replaceState(null, '', '/?session=' + encodeURIComponent(key));
      frame.src = '/session/' + encodeURIComponent(key) + '?t=' + Date.now();
      frame.style.display = 'block';
      welcome.style.display = 'none';
      renderSessions();
      updateSelectionChrome();
      await checkVersion(true);
    }

    async function deactivate(key) {
      const session = sessions.find(function(item) { return item.key === key; });
      if (!session || !session.active) return;
      try {
        const response = await fetch('/api/sessions/close', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({provider: session.provider, session_id: session.session_id, cwd: session.cwd})
        });
        if (!response.ok) throw new Error('HTTP ' + response.status);
        await loadSessions();
        inactiveOpen = true;
        renderSessions();
      } catch (_) {
        liveIndicator.textContent = 'could not deactivate';
      }
    }

    async function checkVersion(force) {
      if (!selected) return;
      try {
        const response = await fetch('/api/sessions/' + encodeURIComponent(selected) + '/version', { cache: 'no-store' });
        if (!response.ok) return;
        const version = await response.text();
        if (force || (selectedVersion && selectedVersion !== version)) {
          frame.src = '/session/' + encodeURIComponent(selected) + '?t=' + Date.now();
        }
        selectedVersion = version;
      } catch (_) {}
    }

    async function connectEvents() {
      while (true) {
        try {
          const response = await fetch('/api/events', { cache: 'no-store' });
          if (!response.ok) throw new Error('HTTP ' + response.status);
          eventsConnected = true;
          if (!selected) liveIndicator.textContent = 'watching';
          const event = await response.json();
          if (event.type === 'artifact_updated' && event.key) {
            if (event.key === selected) {
              markRead(event.key, event.version);
              await checkVersion(true);
            } else {
              unread.add(event.key);
            }
          }
          await loadSessions();
        } catch (_) {
          eventsConnected = false;
          liveIndicator.textContent = selected ? liveIndicator.textContent : 'offline';
          await new Promise(function(resolve) { setTimeout(resolve, 1500); });
        }
      }
    }

    loadSessions();
    connectEvents();
    setInterval(function() {
      if (!eventsConnected) {
        loadSessions();
        checkVersion(false);
      }
    }, 2000);
  </script>
</body>
</html>
