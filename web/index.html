<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Session Whiteboard</title>
  <style>
    :root {
      color-scheme: dark;
      --canvas: #0d1115;
      --panel: #11171d;
      --panel-raised: #171f26;
      --inset: #0a0e12;
      --ink: #e8edf0;
      --ink-secondary: #a8b4bc;
      --ink-muted: #71808b;
      --line: rgba(232,237,240,.10);
      --line-soft: rgba(232,237,240,.06);
      --focus: #76d5df;
      --positive: #8bd5a3;
      --warning: #e3b978;
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 12px;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body {
      overflow: hidden;
      color: var(--ink);
      background: var(--canvas);
      -webkit-font-smoothing: antialiased;
    }
    button, summary { font: inherit; }
    button:focus-visible, summary:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }
    .shell {
      display: grid;
      grid-template-columns: 272px minmax(0, 1fr);
      width: 100%;
      height: 100%;
    }
    .sidebar {
      display: flex;
      flex-direction: column;
      min-width: 0;
      background: var(--panel);
      border-right: 1px solid var(--line);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 52px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--line-soft);
    }
    .brand-mark {
      display: grid;
      place-items: center;
      width: 24px;
      height: 24px;
      color: var(--canvas);
      background: var(--focus);
      font: 800 10px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: -.08em;
    }
    .brand-copy { min-width: 0; }
    .brand small, .section-label, .group-title, .path {
      font: 600 10px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .brand small { color: var(--focus); }
    .brand h1 {
      overflow: hidden;
      margin: 3px 0 0;
      color: var(--ink);
      font-size: 13px;
      font-weight: 650;
      letter-spacing: -.02em;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .sessions {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 12px 8px;
      scrollbar-color: var(--panel-raised) transparent;
    }
    .section-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 8px 7px;
      color: var(--ink-muted);
    }
    .section-count {
      color: var(--ink-secondary);
      font-variant-numeric: tabular-nums;
    }
    .group { margin: 0 0 12px; }
    .group-title {
      overflow: hidden;
      padding: 4px 8px 5px;
      color: var(--ink-muted);
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .session {
      position: relative;
      display: block;
      width: 100%;
      min-height: 50px;
      padding: 8px 9px 8px 12px;
      border: 1px solid transparent;
      border-radius: 5px;
      color: inherit;
      text-align: left;
      background: transparent;
      cursor: pointer;
      transition: background-color 140ms ease-out, border-color 140ms ease-out;
    }
    .session::before {
      position: absolute;
      top: 12px;
      left: 5px;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: var(--positive);
      content: "";
    }
    .session:hover { background: rgba(232,237,240,.045); }
    .session.active {
      background: rgba(118,213,223,.08);
      border-color: rgba(118,213,223,.22);
    }
    .session.active::before { background: var(--focus); }
    .session.inactive { color: var(--ink-secondary); }
    .session.inactive::before { background: var(--ink-muted); }
    .session-title {
      overflow: hidden;
      color: var(--ink);
      font-size: 12px;
      font-weight: 600;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .session.inactive .session-title { color: var(--ink-secondary); }
    .session-meta {
      display: flex;
      gap: 7px;
      margin-top: 4px;
      overflow: hidden;
      color: var(--ink-muted);
      font: 10px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace;
      white-space: nowrap;
    }
    .session-meta span { overflow: hidden; text-overflow: ellipsis; }
    .empty-side {
      padding: 11px 8px 16px;
      color: var(--ink-muted);
      line-height: 1.5;
    }
    .inactive-section {
      margin-top: 14px;
      border-top: 1px solid var(--line-soft);
    }
    .inactive-section summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 11px 8px 7px;
      color: var(--ink-muted);
      cursor: pointer;
      list-style: none;
    }
    .inactive-section summary::-webkit-details-marker { display: none; }
    .inactive-section summary::before {
      margin-right: 6px;
      color: var(--ink-secondary);
      content: "▸";
    }
    .inactive-section[open] summary::before { content: "▾"; }
    .inactive-label {
      display: flex;
      align-items: center;
      flex: 1;
      font: 600 10px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .inactive-count {
      color: var(--ink-muted);
      font: 10px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-height: 42px;
      padding: 8px 12px;
      border-top: 1px solid var(--line-soft);
      color: var(--ink-muted);
      font: 10px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .footer button {
      min-width: 40px;
      min-height: 28px;
      padding: 4px 8px;
      border: 1px solid var(--line);
      border-radius: 4px;
      color: var(--ink-secondary);
      background: transparent;
      cursor: pointer;
    }
    .footer button:hover { color: var(--ink); border-color: rgba(232,237,240,.20); }
    .content {
      display: flex;
      flex-direction: column;
      min-width: 0;
      background: var(--canvas);
    }
    .content-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 52px;
      padding: 0 16px;
      border-bottom: 1px solid var(--line);
    }
    .path {
      overflow: hidden;
      color: var(--ink-muted);
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .path strong { color: var(--ink-secondary); font-weight: 600; }
    .live {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex: none;
      color: var(--ink-muted);
      font: 10px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace;
      text-transform: uppercase;
    }
    .live::before {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--focus);
      content: "";
    }
    .frame-wrap { position: relative; flex: 1; min-height: 0; }
    #artifact {
      display: none;
      width: 100%;
      height: 100%;
      border: 0;
      background: var(--canvas);
    }
    .welcome {
      display: grid;
      align-content: center;
      width: min(540px, 100%);
      height: 100%;
      margin: 0 auto;
      padding: 24px;
    }
    .welcome-kicker {
      margin-bottom: 9px;
      color: var(--focus);
      font: 600 10px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: .10em;
      text-transform: uppercase;
    }
    .welcome h2 {
      margin: 0 0 8px;
      color: var(--ink);
      font-size: 25px;
      font-weight: 650;
      letter-spacing: -.045em;
      line-height: 1;
      text-wrap: balance;
    }
    .welcome p {
      max-width: 430px;
      margin: 0;
      color: var(--ink-secondary);
      font-size: 13px;
      line-height: 1.5;
      text-wrap: pretty;
    }
    @media (max-width: 700px) {
      .shell { grid-template-columns: 224px minmax(0, 1fr); }
      .content-head { padding: 0 12px; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <header class="brand">
        <div class="brand-mark" aria-hidden="true">WB</div>
        <div class="brand-copy">
          <small>Live workspace</small>
          <h1>Session Whiteboard</h1>
        </div>
      </header>
      <nav id="sessions" class="sessions" aria-label="Session whiteboards"></nav>
      <footer class="footer">
        <span id="status" aria-live="polite">connecting…</span>
        <button id="refresh" type="button" title="Refresh sessions">Refresh</button>
      </footer>
    </aside>
    <main class="content">
      <header class="content-head">
        <div id="current-path" class="path"><strong>WHITEBOARD</strong> / SELECT A SESSION</div>
        <div id="live-indicator" class="live">waiting</div>
      </header>
      <div class="frame-wrap">
        <section id="welcome" class="welcome">
          <div>
            <div class="welcome-kicker">Current context</div>
            <h2>Nothing is active yet</h2>
            <p>When an agent opens a session whiteboard, it will appear in the navigation rail. Select it to follow the live view.</p>
          </div>
        </section>
        <iframe id="artifact" title="Session whiteboard"></iframe>
      </div>
    </main>
  </div>
  <script>
    const sessionList = document.querySelector('#sessions');
    const frame = document.querySelector('#artifact');
    const welcome = document.querySelector('#welcome');
    const status = document.querySelector('#status');
    const currentPath = document.querySelector('#current-path');
    const liveIndicator = document.querySelector('#live-indicator');
    let sessions = [];
    let selected = null;
    let selectedVersion = null;
    let requestedSession = new URLSearchParams(window.location.search).get('session');

    function esc(value) {
      return String(value).replace(/[&<>'"]/g, function(c) {
        return {'&':'&amp;', '<':'&lt;', '>':'&gt;', "'":'&#39;', '"':'&quot;'}[c];
      });
    }

    function versionTime(session) {
      const value = String(session.version || '').split('-', 1)[0];
      const parsed = Number(value);
      return Number.isFinite(parsed) ? parsed : 0;
    }

    function groupKey(path) { return path || '(unknown cwd)'; }

    function renderGroups(items) {
      const groups = new Map();
      for (const session of items) {
        const key = groupKey(session.cwd);
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push(session);
      }
      return Array.from(groups.entries()).map(function(entry) {
        const cwd = entry[0];
        const buttons = entry[1].map(function(s) {
          return '<button class="session ' + (s.key === selected ? 'active ' : '') + (s.active ? '' : 'inactive') +
            '" data-key="' + esc(s.key) + '" aria-pressed="' + (s.key === selected ? 'true' : 'false') + '">' +
            '<div class="session-title">' + esc(s.title || 'Untitled session') + '</div>' +
            '<div class="session-meta"><span>' + esc(s.provider) + '</span><span>' +
            esc(String(s.session_id || '').slice(0, 8)) + '</span></div>' +
            '</button>';
        }).join('');
        return '<section class="group"><div class="group-title" title="' + esc(cwd) + '">' +
          esc(cwd) + '</div>' + buttons + '</section>';
      }).join('');
    }

    function bindSessionButtons() {
      sessionList.querySelectorAll('.session').forEach(function(button) {
        button.addEventListener('click', function() { select(button.dataset.key); });
      });
    }

    function renderSessions() {
      const active = sessions.filter(function(s) { return s.active; });
      const inactive = sessions.filter(function(s) { return !s.active; });
      if (!sessions.length) {
        sessionList.innerHTML = '<div class="section-label"><span>Sessions</span><span class="section-count">0</span></div>' +
          '<div class="empty-side">No session whiteboards yet.</div>';
        return;
      }
      const activeMarkup = active.length
        ? renderGroups(active)
        : '<div class="empty-side">No active sessions.</div>';
      const inactiveMarkup = inactive.length
        ? '<details class="inactive-section"' + (inactive.some(function(s) { return s.key === selected; }) ? ' open' : '') +
          '><summary><span class="inactive-label">Inactive</span><span class="inactive-count">' +
          inactive.length + '</span></summary><div>' + renderGroups(inactive) + '</div></details>'
        : '';
      sessionList.innerHTML =
        '<div class="section-label"><span>Active</span><span class="section-count">' + active.length + '</span></div>' +
        activeMarkup + inactiveMarkup;
      bindSessionButtons();
    }

    function updateSelectionChrome() {
      const session = sessions.find(function(s) { return s.key === selected; });
      if (!session) {
        currentPath.innerHTML = '<strong>WHITEBOARD</strong> / SELECT A SESSION';
        liveIndicator.textContent = 'waiting';
        return;
      }
      currentPath.innerHTML = '<strong>' + esc(session.title || 'UNTITLED') + '</strong> / ' + esc(session.cwd || '');
      liveIndicator.textContent = session.active ? 'live' : 'inactive';
    }

    async function loadSessions() {
      try {
        const response = await fetch('/api/sessions', { cache: 'no-store' });
        if (!response.ok) throw new Error('HTTP ' + response.status);
        sessions = await response.json();
        sessions.sort(function(a, b) { return versionTime(b) - versionTime(a); });
        const activeCount = sessions.filter(function(s) { return s.active; }).length;
        const inactiveCount = sessions.length - activeCount;
        status.textContent = activeCount + ' live' + (inactiveCount ? ' · ' + inactiveCount + ' inactive' : '');
        renderSessions();
        updateSelectionChrome();
        if (requestedSession && sessions.some(function(s) { return s.key === requestedSession; })) {
          const key = requestedSession;
          requestedSession = null;
          await select(key);
        }
        if (selected && !sessions.some(function(s) { return s.key === selected; })) {
          selected = null;
          selectedVersion = null;
          frame.style.display = 'none';
          welcome.style.display = 'grid';
          updateSelectionChrome();
        }
      } catch (error) {
        status.textContent = 'disconnected';
        liveIndicator.textContent = 'offline';
      }
    }

    async function select(key) {
      selected = key;
      selectedVersion = null;
      history.replaceState(null, '', '/?session=' + encodeURIComponent(key));
      frame.src = '/session/' + encodeURIComponent(key) + '?t=' + Date.now();
      frame.style.display = 'block';
      welcome.style.display = 'none';
      renderSessions();
      updateSelectionChrome();
      await checkVersion(true);
    }

    async function checkVersion(force) {
      if (!selected) return;
      try {
        const response = await fetch('/api/sessions/' + encodeURIComponent(selected) + '/version', { cache: 'no-store' });
        if (!response.ok) return;
        const version = await response.text();
        if (force || (selectedVersion && selectedVersion !== version)) {
          frame.src = '/session/' + encodeURIComponent(selected) + '?t=' + Date.now();
        }
        selectedVersion = version;
      } catch (_) {}
    }

    document.querySelector('#refresh').addEventListener('click', loadSessions);
    loadSessions();
    setInterval(loadSessions, 1500);
    setInterval(function() { checkVersion(false); }, 700);
  </script>
</body>
</html>
