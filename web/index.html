<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Session Whiteboard</title>
  <style>
    :root {
      color-scheme: light;
      --canvas: #eeece5;
      --ink: #293130;
      --secondary: #59635f;
      --marker: #176a83;
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 12px;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body {
      overflow: hidden;
      color: var(--ink);
      background: var(--canvas);
      -webkit-font-smoothing: antialiased;
    }
    .empty {
      display: grid;
      align-content: center;
      width: min(560px, 100%);
      height: 100%;
      margin: 0 auto;
      padding: 24px;
    }
    .empty-kicker {
      margin-bottom: 9px;
      color: var(--marker);
      font: 600 10px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: .10em;
      text-transform: uppercase;
    }
    .empty h1 {
      margin: 0 0 8px;
      font-size: 25px;
      font-weight: 650;
      letter-spacing: -.045em;
      line-height: 1;
    }
    .empty p {
      max-width: 430px;
      margin: 0;
      color: var(--secondary);
      font-size: 13px;
      line-height: 1.5;
    }
    #artifact {
      display: none;
      width: 100%;
      height: 100%;
      border: 0;
      background: var(--canvas);
    }
  </style>
</head>
<body>
  <main id="empty" class="empty">
    <div>
      <div class="empty-kicker">Session whiteboard</div>
      <h1>No whiteboard selected</h1>
      <p>Open the viewer URL returned by <code>session-whiteboard prepare</code> to show one whiteboard here.</p>
    </div>
  </main>
  <iframe id="artifact" title="Session whiteboard"></iframe>
  <script>
    const empty = document.querySelector('#empty');
    const frame = document.querySelector('#artifact');
    const selected = new URLSearchParams(window.location.search).get('session');
    let selectedVersion = null;

    function artifactUrl() {
      return '/session/' + encodeURIComponent(selected) + '?t=' + Date.now();
    }

    function showArtifact() {
      frame.src = artifactUrl();
      frame.style.display = 'block';
      empty.style.display = 'none';
    }

    async function checkVersion(force) {
      if (!selected) return;
      try {
        const response = await fetch('/api/sessions/' + encodeURIComponent(selected) + '/version', {cache: 'no-store'});
        if (!response.ok) return;
        const version = await response.text();
        if (force || (selectedVersion && selectedVersion !== version)) showArtifact();
        selectedVersion = version;
      } catch (_) {}
    }

    async function connectEvents() {
      while (selected) {
        try {
          const response = await fetch('/api/events', {cache: 'no-store'});
          if (!response.ok) throw new Error('HTTP ' + response.status);
          const event = await response.json();
          if (event.type === 'artifact_updated' && event.key === selected) {
            selectedVersion = event.version || selectedVersion;
            showArtifact();
          }
        } catch (_) {
          await new Promise(function(resolve) { setTimeout(resolve, 1500); });
        }
      }
    }

    if (selected) {
      showArtifact();
      checkVersion(false);
      connectEvents();
      setInterval(function() { checkVersion(false); }, 2000);
    }
  </script>
</body>
</html>
